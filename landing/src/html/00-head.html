<head><!-- build.mjs also writes a page per palette (monokai.html) from this
     file, changing only four things: the html tag gains data-palette (its
     name), color-scheme becomes dark, theme-color becomes that palette's
     --ground, and the palette's CSS is inlined in a style element after the
     styles.css link. Keep the html tag, those two metas and that link exactly
     as written here. (No literal tags in this comment: smoke.mjs reads a
     page's palette from the first html tag carrying data-palette, and
     --keep-comments ships this comment.) -->
